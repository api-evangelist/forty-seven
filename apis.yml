name: Forty Seven *
description: 'Forty Seven, Inc. was an immuno-oncology biotechnology company founded in 2015 to
  commercialize CD47 immune-evasion research licensed from Stanford University (Irv Weissman and colleagues).
  Its lead program was magrolimab, a monoclonal antibody targeting CD47 — the "do not eat me" signal tumor
  cells use to evade macrophage-mediated killing — studied in myelodysplastic syndrome (MDS), acute myeloid
  leukemia (AML), and diffuse large B-cell lymphoma (DLBCL). Backed by GV, the company was acquired by
  Gilead Sciences in 2020 for roughly $4.9 billion; the fortyseveninc.com domain now redirects to
  gilead.com. As a clinical-stage therapeutics company it exposes no public developer API surface.'
